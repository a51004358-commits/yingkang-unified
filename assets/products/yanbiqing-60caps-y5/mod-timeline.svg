<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="日常節奏示意">
  <rect width="720" height="160" rx="12" fill="#fffaf5"/>
  <line x1="80" y1="80" x2="640" y2="80" stroke="#E87722" stroke-width="3" stroke-dasharray="6 6"/>
  <g font-family="Noto Sans TC, sans-serif" text-anchor="middle">
    <circle cx="120" cy="80" r="18" fill="#E87722"/><text x="120" y="86" fill="#fff" font-size="12" font-weight="700">1</text>
    <text x="120" y="120" fill="#555" font-size="13" font-weight="700">第 1 日</text>
    <circle cx="360" cy="80" r="18" fill="#E87722"/><text x="360" y="86" fill="#fff" font-size="12" font-weight="700">7</text>
    <text x="360" y="120" fill="#555" font-size="13" font-weight="700">第 1 週</text>
    <circle cx="600" cy="80" r="18" fill="#E87722"/><text x="600" y="86" fill="#fff" font-size="12" font-weight="700">∞</text>
    <text x="600" y="120" fill="#555" font-size="13" font-weight="700">日常節奏</text>
  </g>
</svg>